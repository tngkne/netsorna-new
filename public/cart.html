<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    .cart-item { border-bottom: 1px solid #ddd; padding: 10px 0; }
    #pay-button { 
      background: #00a650; color: white; border: none; 
      padding: 15px 30px; font-size: 18px; cursor: pointer; 
      border-radius: 5px; margin-top: 20px; width: 100%;
    }
    #pay-button:hover { background: #008f43; }
    input { padding: 10px; width: 100%; margin: 10px 0; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Your Cart</h1>
  
  <div class="cart-item">
    <h3>T-Shirt</h3>
    <p>Quantity: 1</p>
    <p>Price: R250.00</p>
  </div>

  <label for="email">Email:</label>
  <input type="email" id="email" placeholder="your@email.com" value="test@example.com">

  <button id="pay-button">Pay with Yoco</button>

  <script src="/js/checkout.js"></script>
</body>
</html>
