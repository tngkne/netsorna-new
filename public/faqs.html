<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Frequently Asked Questions — Netsorna</title>

  <link rel="canonical" href="https://netsorna.website/faqs.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/shop.css" />

  <style>
    .faq-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
      max-width: 800px;
    }
    .faq-item {
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #ffffff;
      overflow: hidden;
    }
    .faq-question {
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 16px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease;
    }
    .faq-question:hover {
      background: var(--accent-light);
    }
    .faq-icon {
      font-size: 1.2rem;
      line-height: 1;
      transition: transform 0.2s ease;
    }
    .faq-item.open .faq-icon {
      transform: rotate(45deg);
    }
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s ease;
      padding: 0 20px;
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .faq-item.open .faq-answer {
      max-height: 300px;
      padding: 0 20px 18px 20px;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <div class="navbar-wrapper">
    <header class="navbar" id="navbar">
      <div class="navbar-bar">
        <button class="menu-btn" aria-label="Toggle Navigation Menu" id="menuToggle">
          <svg class="icon-hamburger" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
          <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <a href="/index.html" class="brand-logo" aria-label="Netsorna Home">
          <img src="/images/icons/horizontal_logo.svg" alt="Netsorna Logo" class="logo-img" width="160" height="40" onerror="this.outerHTML='<span class=\'logo-text\'>NETSORNA.</span>'" />
        </a>

        <a href="/cart.html" class="cart-btn" aria-label="View Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
      </div>

      <nav class="nav-drawer" id="navDrawer" aria-hidden="true">
        <ul class="nav-links">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/shop.html">Shop Artworks</a></li>
          <li><a href="/blog.html">Blog & Stories</a></li>
          <li><a href="/faqs.html" class="active">FAQs</a></li>
        </ul>
      </nav>
    </header>
  </div>

  <main class="catalogue-main-wrapper">
    <section class="catalogue-header">
      <h1>Frequently Asked Questions</h1>
      <p>Everything you need to know about commissions, shipping timelines, and custom installations.</p>
    </section>

    <div class="faq-container" id="faqGrid">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <span>&copy; 2026 Netsorna. All rights reserved.</span>
    </div>
  </footer>

  <div id="netsorna-toast"></div>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('faqGrid');

      const defaultFaqs = [
        {
          q: "How long do custom commissions take?",
          a: "Custom portrait and object sculptures typically require 7–14 business days for production, quality checking, and protective packaging prior to dispatch."
        },
        {
          q: "How are grand luxury panels handled?",
          a: "Installations over R15,000 are produced exclusively via personal consultation. Click 'Inquire via WhatsApp' on the product page to discuss dimensions, materials, and direct courier delivery."
        },
        {
          q: "What happens when weekly order caps are reached?",
          a: "To preserve studio craftsmanship quality, we limit order volume weekly. Once the limit is reached, checkout temporarily switches to a notify-me waitlist for the next slot."
        },
        {
          q: "What payment options do you support?",
          a: "We accept secure online card payments powered by Yoco, supporting all major South African credit and debit cards."
        }
      ];

      try {
        const res = await fetch('/content/pages/faqs.json');
        const data = res.ok ? await res.json() : defaultFaqs;
        const faqs = Array.isArray(data) ? data : (data.faqs || defaultFaqs);

        grid.innerHTML = faqs.map(item => `
          <div class="faq-item">
            <button class="faq-question" onclick="toggleFaq(this)">
              <span>${item.q || item.question}</span>
              <span class="faq-icon">+</span>
            </button>
            <div class="faq-answer">
              <p>${item.a || item.answer}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.warn('Using default FAQ list:', err);
        grid.innerHTML = defaultFaqs.map(item => `
          <div class="faq-item">
            <button class="faq-question" onclick="toggleFaq(this)">
              <span>${item.q}</span>
              <span class="faq-icon">+</span>
            </button>
            <div class="faq-answer">
              <p>${item.a}</p>
            </div>
          </div>
        `).join('');
      }
    });

    function toggleFaq(button) {
      const item = button.parentElement;
      item.classList.toggle('open');
    }
  </script>
</body>
</html>
